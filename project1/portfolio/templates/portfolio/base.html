<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Momentum Trader{% endblock %}</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #182b39; background: #f4f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #152e40; color: white; padding: 20px max(24px, calc((100% - 1100px) / 2)); display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    header a { color: white; text-decoration: none; font-weight: 700; }
    nav { display: flex; gap: 20px; align-items: center; }
    main { max-width: 1100px; margin: 48px auto; padding: 0 24px; }
    h1 { margin-bottom: 8px; font-size: 32px; }
    .muted { color: #586e7f; }
    .panel { background: white; border: 1px solid #dbe4ec; border-radius: 12px; padding: 24px; margin-top: 28px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 18px 12px; text-align: left; border-bottom: 1px solid #e7edf2; }
    th { color: #586e7f; font-size: 13px; }
    tr:last-child td { border-bottom: 0; }
    .number { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .badge { display: inline-block; padding: 5px 10px; border-radius: 20px; background: #e5f5ed; color: #226646; font-size: 13px; }
    .inactive { background: #edf0f3; color: #586e7f; }
    .description { margin-top: 5px; font-size: 14px; max-width: 360px; }
    button, .button { border: 0; border-radius: 6px; background: #176c88; color: white; padding: 11px 18px; cursor: pointer; text-decoration: none; display: inline-block; font: inherit; }
    header button { background: transparent; padding: 0; }
    .empty { text-align: center; padding: 40px 12px; }
    .pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; gap: 16px; }
    .login { max-width: 440px; margin: auto; }
    label { display: block; margin: 16px 0 6px; }
    input { width: 100%; padding: 12px; border: 1px solid #b8c8d4; border-radius: 6px; font: inherit; }
    .error { color: #a52c35; }
    @media (max-width: 600px) { main { margin-top: 28px; } .panel { padding: 12px; } header { padding: 18px 24px; } nav { gap: 12px; } }
  </style>
</head>
<body>
  <header>
    <a href="{% url 'portfolio:list' %}">Momentum Trader</a>
    {% if user.is_authenticated %}
    <nav aria-label="Account">
      {% if user.is_staff %}<a href="{% url 'admin:index' %}">Admin</a>{% endif %}
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Sign out</button></form>
    </nav>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
